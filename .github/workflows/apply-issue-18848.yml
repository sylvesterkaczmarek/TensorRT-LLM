name: Apply issue 18848 patch

on:
  push:
    branches:
      - fix-cpu-affinity-idempotence-18848

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared patch
        run: |
          git apply .github/patches/issue-18848.patch
          rm .github/patches/issue-18848.patch .github/workflows/apply-issue-18848.yml
          git config user.name 'Sylvester Kaczmarek'
          git config user.email '16242628+sylvesterkaczmarek@users.noreply.github.com'
          git add -A
          git commit -s -m 'fix(llmapi): keep NUMA affinity across repeated configuration'
          git push origin HEAD:fix-cpu-affinity-idempotence-18848

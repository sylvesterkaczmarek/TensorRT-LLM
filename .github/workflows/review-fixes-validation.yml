name: Review fixes validation

on:
  push:
    branches:
      - review-validation-20260910-05bdd76

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: registry
            sha: 05bdd76c8ffb31ab691a50d36a57e740cc7d7bad
            paths: scripts/check_model_registry.py tests/unittest/scripts/test_check_model_registry.py
          - target: schema
            sha: f03334ee2aad40610680a1a536e787f341f3d2b1
            paths: tensorrt_llm/usage/schemas/__main__.py tests/unittest/usage/test_schema.py
    steps:
      - name: Check out the exact review commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/sylvesterkaczmarek/TensorRT-LLM.git source
          git -C source fetch origin ${{ matrix.sha }}
          git -C source checkout --detach FETCH_HEAD
      - name: Install CPU test and formatting tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pre-commit pytest pyyaml 'pydantic>=2,<3'
      - name: Apply schema review cleanup
        if: matrix.target == 'schema'
        working-directory: source
        run: |
          ../.venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tensorrt_llm/usage/schemas/__main__.py')
          before = path.read_text()
          old = '    """Check Pydantic model fields match the SMS JSON schema properties.\n\n    Returns a list of human-readable error strings (empty = all good).\n    """'
          new = '    """Validate Pydantic/SMS property names and SMS requiredness parity.\n\n    Check model aliases against SMS properties and verify that every SMS\n    event has the same properties and required fields, including events\n    without a registered Pydantic model.\n\n    Return human-readable error strings, or an empty list when all checks pass.\n    """'
          assert before.count(old) == 1
          after = before.replace(old, new)
          old_tree, new_tree = ast.parse(before), ast.parse(after)
          for tree in (old_tree, new_tree):
              function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'validate')
              assert isinstance(function.body[0], ast.Expr)
              function.body.pop(0)
          assert ast.dump(old_tree) == ast.dump(new_tree), 'Runtime code changed'
          path.write_text(after)

          path = Path('tests/unittest/usage/test_schema.py')
          text = path.read_text()
          tree = ast.parse(text)
          matches = [node for node in ast.walk(tree) if isinstance(node, ast.FunctionDef) and node.name == 'test_initial_report_required_fields']
          assert len(matches) == 1
          node = matches[0]
          lines = text.splitlines(keepends=True)
          del lines[node.lineno - 1:node.end_lineno + 1]
          after = ''.join(lines)
          assert 'def test_heartbeat_required_fields' in after
          ast.parse(after)
          path.write_text(after)
          PY
      - name: Apply formatting and verify repository hooks
        working-directory: source
        run: |
          ../.venv/bin/pre-commit run --files ${{ matrix.paths }} || true
          ../.venv/bin/pre-commit run --files ${{ matrix.paths }}
          git diff --check
      - name: Run registry tests
        if: matrix.target == 'registry'
        working-directory: source
        run: ../.venv/bin/python -m pytest --noconftest -o addopts='' -q tests/unittest/scripts/test_check_model_registry.py
      - name: Run schema tests without CUDA package initialization
        if: matrix.target == 'schema'
        working-directory: source
        run: |
          ../.venv/bin/python - <<'PY'
          import sys
          import types
          from pathlib import Path
          import pytest

          for name in ('tensorrt_llm', 'tensorrt_llm.usage'):
              package = types.ModuleType(name)
              package.__path__ = [str(Path(name.replace('.', '/')).resolve())]
              sys.modules[name] = package
          raise SystemExit(pytest.main([
              '--noconftest', '-o', 'addopts=', '-q',
              'tests/unittest/usage/test_schema_requiredness.py',
              'tests/unittest/usage/test_schema.py',
          ]))
          PY
      - name: Save validated commit on a temporary fork branch
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOWED_PATHS: ${{ matrix.paths }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed and changed <= set(os.environ['ALLOWED_PATHS'].split()), changed
          PY
          git config user.name 'Sylvester Kaczmarek'
          git config user.email '16242628+sylvesterkaczmarek@users.noreply.github.com'
          git add ${{ matrix.paths }}
          git commit -s -m 'chore: apply ${{ matrix.target }} review cleanup'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/review-validated-${{ matrix.target }}-20260910
          printf 'VALIDATED_COMMIT='; git rev-parse HEAD
          printf 'VALIDATED_TREE='; git rev-parse HEAD^{tree}
          git show --stat --oneline HEAD
      - name: Report remaining changes
        if: always()
        working-directory: source
        run: |
          git diff --check
          git diff --stat
          git diff -- ${{ matrix.paths }}
